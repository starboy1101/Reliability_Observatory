[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-observatory-api"
version = "0.1.0"
description = "Professional LLM evaluation and red-teaming API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]
deepeval = ["deepeval>=2,<5"]
langsmith = ["langsmith>=0.3,<1"]
all-integrations = ["deepeval>=2,<5", "langsmith>=0.3,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501", # Prompt fixtures are prose; wrapping them obscures the benchmark text.
  "B008", # FastAPI intentionally declares Query metadata in function defaults.
]
