name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest --cov=app --cov-report=term-missing
      - name: Audit runtime Python dependencies
        run: |
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit --requirement requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

  model-target:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hf-space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hf-space/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m py_compile app.py model_api/*.py
      - run: python -m pytest

  container:
    needs: [backend, frontend, model-target]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reliability-observatory:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test production image
        run: |
          docker compose up --detach --no-build
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/readyz; then
              test "$(docker compose exec -T app id -u)" != "0"
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Clean up smoke environment
        if: always()
        run: docker compose down --volumes
