services:
  - type: web
    name: reliability-observatory
    runtime: docker
    plan: starter
    region: singapore
    autoDeployTrigger: checksPass
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    disk:
      name: reliability-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/reliability.db
      - key: STATIC_DIR
        value: /app/static
      - key: CORS_ORIGINS
        value: ""
      - key: ALLOW_PRIVATE_TARGET_URLS
        value: "false"
      - key: MAX_RUN_CONCURRENCY
        value: "1"
      - key: MAX_ACTIVE_RUNS
        value: "2"
      - key: MAX_DEMO_DELAY_MS
        value: "50"
      - key: MAX_ACTIVE_LIVE_RUNS
        value: "1"
      - key: MAX_LIVE_RUN_PROMPTS
        value: "6"
      - key: TARGET_TIMEOUT_SECONDS
        value: "300"
      - key: TARGET_WARMUP_SECONDS
        value: "300"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: INSTALL_OPTIONAL_INTEGRATIONS
        value: "false"
